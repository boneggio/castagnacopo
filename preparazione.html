<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7b3f1d">
<title>Castagnacopo – Preparazione sacchetti</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e8;--card:#fffdf9;--ink:#2b1d14;--muted:#7a6656;--line:#e6d9c8;--brand:#7b3f1d;--accent:#c98a3c;--ok:#3f7a3a;--err:#a8322a}
@media (prefers-color-scheme:dark){:root{--bg:#1b140f;--card:#251b14;--ink:#f3e9dd;--muted:#b9a593;--line:#3a2c21;--brand:#d98b52;--accent:#e0a85a;--ok:#8fcf86;--err:#f08a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header img{width:48px;height:48px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;color:var(--brand);margin:0;font-size:1.7rem;line-height:1.1}
.sub{color:var(--muted);margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.todo{margin-bottom:14px}
.todo small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:8px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sz{text-align:center;background:var(--bg);border-radius:12px;padding:8px 4px}
.sz b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sz span{font-size:.78rem;color:var(--muted)}
.prog{margin-top:10px;font-size:.88rem;color:var(--muted)}
.prog b{color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 10px}
.seg{display:flex;flex:1 1 100%;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--ink);padding:8px 6px;font:500 .86rem Inter,sans-serif;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
select,input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
#q{flex:1 1 140px}
.list{display:grid;gap:10px}
.o{display:grid;gap:10px}
.o.full{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.o.gone{opacity:.55}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.o h3{margin:0;font-size:1.05rem}
.o .det{color:var(--muted);font-size:.85rem}
.st{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.st.part{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.st.full{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.rows{display:grid;gap:6px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:var(--bg)}
.line .lbl{font-weight:600}
.line .lbl small{font-weight:400;color:var(--muted);margin-left:6px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 1.1rem Inter,sans-serif;cursor:pointer;line-height:1}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.step output b{font-size:1.05rem}
.line.done .step output b{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 .88rem Inter,sans-serif;cursor:pointer;background:var(--ok);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
/* campo data vuoto: Safari mostra in grigio la data di oggi e sembra già compilato; qui si vede "nessuna data" */
.dwrap{position:relative;display:inline-block}
.dwrap .ph{display:none;position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-style:italic;font-weight:400}
.dwrap input.empty{min-width:150px}
.dwrap input.empty:not(:focus){color:transparent}
.dwrap input.empty:not(:focus)::-webkit-datetime-edit{color:transparent}
.dwrap input.empty:not(:focus) + .ph{display:block}
.saving{font-size:.8rem;color:var(--muted);margin-left:auto}
.dal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.dal input{padding:6px 8px}
.dal.warn{color:var(--err);font-weight:600}
.dal.warn input{border-color:var(--err)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.err{color:var(--err)}
/* riepilogo: solo nome, pagato e consegnato */
.sum{padding:6px 16px}
.sum .tot{color:var(--muted);font-size:.85rem;padding:8px 0 6px}
.sum .tot b{color:var(--ink)}
.sum .r{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sum .r.h{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0;border-top:0;padding-bottom:4px}
.sum .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sum .n small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.sum .c{width:76px;text-align:center}
.sum .r{grid-template-columns:1fr auto auto auto}
.yn.na{color:var(--muted)}
.yn.gift{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink)}
.gift{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted);cursor:pointer}
.gift input{width:18px;height:18px;accent-color:var(--brand)}
.o .det .tg{color:var(--brand);font-weight:600}
.yn{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.yn.si{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.yn.no{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
@media (max-width:400px){ .sum .c{width:62px} .sum{padding:6px 12px} .yn{padding:3px 7px} }
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo.svg" alt=""><div><h1 id="title">Preparazione sacchetti</h1></div></header>
  <p class="sub" id="sub">Caricamento…</p>

  <div id="app" hidden>
    <div class="card todo">
      <small>Sacchetti ancora da preparare</small>
      <div class="sizes" id="todo"></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="bar">
      <div class="seg" role="group" aria-label="Filtro">
        <button class="on" data-f="todo">Da preparare</button><button data-f="full">Pronti</button><button data-f="">Tutti</button><button data-f="sum">Riepilogo</button>
      </div>
      <input id="q" placeholder="Cerca nome…" aria-label="Cerca per nome">
      <select id="anno" aria-label="Anno" hidden></select>
    </div>
    <div class="list" id="list"></div>
  </div>
  <p class="err" id="err" hidden></p>
  <footer>Castagnacopo · le castagne di Caprese Michelangelo</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://castagnacopo.maurizio-covarelli.workers.dev/api';
const SZ = [1,2,3,5];
// se il server risponde con un errore invece dei dati, riprova da solo qualche volta
async function apiFetch(url, opts, tries = 3){
  let last;
  for (let i = 0; i < tries; i++){
    try{
      const r = await fetch(url, opts); const t = await r.text();
      try { return JSON.parse(t); } catch(e){ last = e; }
    }catch(e){ last = e; }
    if (i < tries-1) await new Promise(res => setTimeout(res, 1000 * (i+1)));
  }
  throw new Error('Il server non risponde in questo momento. Riprova tra qualche secondo.');
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TK = new URLSearchParams(location.search).get('k') || '';
const tot = (o,p) => SZ.reduce((t,s)=>t+(+o[p+s]||0),0);
const isFull = o => tot(o,'q')>0 && SZ.every(s=>(+o['r'+s]||0)===(+o['q'+s]||0));
const fmtDay = d => { const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}` : ''; };
let D = {orders:[]}, filter = 'todo', timers = {}, saving = {};

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }

async function load(anno){
  try{
    const j = await apiFetch(SCRIPT_URL+'?action=prep&t='+encodeURIComponent(TK)+(anno?'&anno='+anno:''));
    if(!j.ok) throw new Error(j.error||'Errore');
    D = j;
    $('title').textContent = 'Ciao ' + j.nome.split(' ')[0] + '!';
    $('sub').textContent = `Sacchetti da preparare per gli ordini del ${j.anno}. Usa + e − oppure il pulsante "Segna tutto pronto", poi scegli da quando si può ritirare: i referenti lo vedono subito.`;
    if (j.anni && j.anni.length > 1){ $('anno').hidden=false; $('anno').innerHTML = j.anni.map(a=>`<option ${a===j.anno?'selected':''}>${a}</option>`).join(''); }
    $('app').hidden = false; render();
  }catch(e){ $('sub').textContent=''; $('err').hidden=false; $('err').textContent = TK ? e.message : 'Questo link non è completo. Chiedi il tuo link personale a chi organizza.';
    if (TK && /server/.test(e.message)) { const b=document.createElement('button'); b.textContent='Riprova'; b.style.cssText='margin-left:8px;padding:6px 12px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;cursor:pointer'; b.onclick=()=>{ $('err').hidden=true; $('sub').textContent='Caricamento…'; load(); }; $('err').appendChild(b); } }
}

function status(o){
  const n = tot(o,'q'), r = tot(o,'r');
  if (o.consegnato) return `<span class="st">Già consegnato</span>`;
  if (isFull(o)) return `<span class="st full">✓ Pronto${o.prontoDal?' · ritiro da '+fmtDay(o.prontoDal):' · senza data'}</span>`;
  if (r) return `<span class="st part">Pronti ${r} di ${n}</span>`;
  return `<span class="st">Da preparare</span>`;
}

function render(){
  const act = D.orders.filter(o=>!o.consegnato);
  $('todo').innerHTML = SZ.map(s=>{ const left = act.reduce((t,o)=>t+Math.max(0,(+o['q'+s]||0)-(+o['r'+s]||0)),0);
    return `<div class="sz"><b>${left}</b><span>da ${s} kg</span></div>`; }).join('');
  const full = act.filter(isFull).length;
  $('prog').innerHTML = `Ordini pronti: <b>${full} su ${act.length}</b>`;

  const f = $('q').value.trim().toLowerCase();
  if (filter==='sum') return renderSum(f);
  const list = D.orders.filter(o => (filter==='todo' ? (!o.consegnato && !isFull(o)) : filter==='full' ? (isFull(o) || o.consegnato) : true)
      && (!f || `${o.nome} ${o.cognome} ${o.contatto}`.toLowerCase().includes(f)))
    .sort((a,b)=> String(a.data).localeCompare(String(b.data)));
  $('list').innerHTML = list.map(o => `
    <div class="card o ${isFull(o)?'full':''} ${o.consegnato?'gone':''}" data-o="${esc(o.id)}">
      <div class="top"><div><h3>${esc(o.nome)} ${esc(o.cognome)}</h3><div class="det">tramite ${esc(o.contatto||'—')} · ${o.kg} kg${o.regalato?' · <span class="tg">regalato</span>':''}</div></div>${status(o)}</div>
      <div class="rows">${SZ.filter(s=>o['q'+s]).map(s=>{ const q=+o['q'+s], r=+o['r'+s]||0;
        return `<div class="line ${r===q?'done':''}"><span class="lbl">${s} kg<small>${q} sacchett${q===1?'o':'i'}</small></span>
          <span class="step"><button data-d="-1" data-s="${s}" ${r<=0||o.consegnato?'disabled':''} aria-label="Uno in meno da ${s} kg">−</button>
          <output><b>${r}</b> / ${q}</output>
          <button data-d="1" data-s="${s}" ${r>=q||o.consegnato?'disabled':''} aria-label="Uno in più da ${s} kg">+</button></span></div>`; }).join('')}</div>
      ${o.consegnato ? '' : `<label class="dal ${isFull(o)&&!o.prontoDal?'warn':''}">${isFull(o)&&!o.prontoDal?'Scegli da quando si può ritirare:':'Ritiro da'}
        <span class="dwrap"><input type="date" data-dal class="${o.prontoDal?'':'empty'}" value="${esc(o.prontoDal||'')}" aria-label="Data da cui si può ritirare"><span class="ph">nessuna data</span></span>${o.prontoDal ? `<button type="button" class="btn ghost sm" data-cleardal="1" aria-label="Togli la data di ritiro">Togli data</button>` : ''}</label>
      <div class="acts">
        ${isFull(o) ? `<button class="btn ghost" data-all="0">Rimetti da preparare</button>` : `<button class="btn" data-all="1">Segna tutto pronto</button>`}
        <label class="gift"><input type="checkbox" data-gift ${o.regalato?'checked':''}> Regalato</label>
        <span class="saving">${saving[o.id]||''}</span></div>`}
    </div>`).join('') || `<div class="card empty">${D.orders.length ? (filter==='todo' ? 'Tutto preparato, ottimo lavoro!' : 'Nessun ordine in questo elenco.') : 'Ancora nessun ordine.'}</div>`;
}

// riepilogo in sola lettura: nome e cognome con accanto pagato e consegnato (come nel pannello amministratore)
function renderSum(f){
  const all = D.orders, yn = v => v ? '<span class="yn si">✓ Sì</span>' : '<span class="yn no">No</span>';
  const gift = v => v ? '<span class="yn gift">✓ Sì</span>' : '<span class="yn na">—</span>';
  const list = all.filter(o => !f || `${o.nome} ${o.cognome} ${o.contatto}`.toLowerCase().includes(f))
    .sort((a,b)=> `${a.cognome} ${a.nome}`.localeCompare(`${b.cognome} ${b.nome}`, 'it'));
  const pag = all.filter(o=>o.pagato).length, con = all.filter(o=>o.consegnato).length, reg = all.filter(o=>o.regalato).length;
  $('list').innerHTML = !all.length ? '<div class="card empty">Ancora nessun ordine.</div>' : `<div class="card sum">
    <div class="tot">Pagati <b>${pag} su ${all.length}</b> · Consegnati <b>${con} su ${all.length}</b>${reg?` · Regalati <b>${reg}</b>`:''}</div>
    <div class="r h"><span>Nome</span><span class="c">Consegn.</span><span class="c">Pagato</span><span class="c">Regalato</span></div>
    ${list.map(o=>`<div class="r"><span class="n">${esc(o.nome)} ${esc(o.cognome)}<small>${o.kg} kg · tramite ${esc(o.contatto||'—')}</small></span><span class="c">${yn(o.consegnato)}</span><span class="c">${o.regalato&&!o.pagato?'<span class="yn na">—</span>':yn(o.pagato)}</span><span class="c">${gift(o.regalato)}</span></div>`).join('')
      || '<div class="empty">Nessun ordine con questo nome.</div>'}</div>`;
}

// salvataggio: subito per "Tutto pronto" e per la data, dopo una breve pausa per + e − (così più tocchi diventano una sola richiesta).
// Non si ridisegna la pagina mentre si salva, altrimenti un tocco su un pulsante può andare perso.
const pend = {};
function mark(o, txt){ saving[o.id] = txt; const el = document.querySelector(`[data-o="${CSS.escape(o.id)}"] .saving`); if (el) el.textContent = txt; }
function body(o){ const r = {}; SZ.forEach(s=>r[s]=+o['r'+s]||0); return JSON.stringify({action:'prepSet', t:TK, anno:D.anno, id:o.id, r, dal:o.prontoDal||''}); }
function save(o, wait){
  clearTimeout(timers[o.id]); pend[o.id] = o; mark(o, 'Salvataggio…');
  timers[o.id] = setTimeout(()=>send(o), wait ? 600 : 0);
}
async function send(o){
  delete pend[o.id]; clearTimeout(timers[o.id]);
  try{
    const j = await apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body(o)});
    if(!j.ok) throw new Error(j.error||'non salvato');
    SZ.forEach(s=>o['r'+s]=j['r'+s]); o.prontoDal=j.prontoDal; saving[o.id]='Salvato';
    if (isFull(o)) toast(o.prontoDal ? `${o.nome} ${o.cognome}: pronto, ritiro da ${fmtDay(o.prontoDal)}` : `${o.nome} ${o.cognome}: pronto. Ora scegli la data di ritiro`);
  }catch(x){ saving[o.id]=''; toast('Non salvato: '+x.message); load(D.anno); return; }
  safeRender(); setTimeout(()=>{ if(saving[o.id]==='Salvato'){ saving[o.id]=''; safeRender(); } }, 1800);
}
// non ridisegnare mentre un dito o il mouse è premuto: il pulsante sotto sparirebbe e il tocco andrebbe perso
let down = false, later = false;
document.addEventListener('pointerdown', ()=>{ down = true; }, true);
document.addEventListener('pointerup', ()=>{ setTimeout(()=>{ down = false; if (later){ later = false; render(); } }, 0); }, true);
document.addEventListener('pointercancel', ()=>{ down = false; }, true);
function safeRender(){ if (down) later = true; else render(); }
// se si chiude la pagina o si passa a un'altra app prima del salvataggio, si manda subito quello che manca
function flush(){ Object.values(pend).forEach(o=>{ clearTimeout(timers[o.id]); delete pend[o.id];
  try{ fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body(o),keepalive:true}); }catch(x){} }); }
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') flush(); });
addEventListener('beforeunload', e => { if (Object.keys(pend).length){ flush(); } });

$('list').onclick = e => {
  const card = e.target.closest('[data-o]'); if(!card) return;
  const o = D.orders.find(x=>x.id===card.dataset.o); if(!o || o.consegnato) return;
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.cleardal){ o.prontoDal = ''; render(); return save(o, false); }
  // "Rimetti da preparare" toglie anche la data di ritiro: un ordine da preparare non ha ancora una data
  if (b.dataset.all){ SZ.forEach(s=>o['r'+s] = b.dataset.all==='1' ? (+o['q'+s]||0) : 0); if (b.dataset.all==='0') o.prontoDal = ''; render(); return save(o, false); }
  if (b.dataset.s){ const s=b.dataset.s; o['r'+s] = Math.max(0, Math.min(+o['q'+s]||0, (+o['r'+s]||0) + +b.dataset.d)); render(); save(o, true); }
};
// la data si salva sia con "change" sia con "input": su iPhone il tasto "Azzera" del calendario manda solo "input"
function dalEvent(e, wait){
  if (!e.target.matches('[data-dal]')) return;
  const card = e.target.closest('[data-o]'); const o = card && D.orders.find(x=>x.id===card.dataset.o); if(!o) return;
  const v = e.target.value || '';
  if (v === (o.prontoDal||'') && !pend[o.id]) return;
  e.target.classList.toggle('empty', !v);
  o.prontoDal = v; save(o, wait);   // niente ridisegno qui: il tocco successivo (es. "Segna tutto pronto") non va perso
}
$('list').addEventListener('change', e => dalEvent(e, false));
// "Regalato": si salva subito
$('list').addEventListener('change', async e => {
  if (!e.target.matches('[data-gift]')) return;
  const card = e.target.closest('[data-o]'); const o = card && D.orders.find(x=>x.id===card.dataset.o); if(!o) return;
  const v = e.target.checked; o.regalato = v; mark(o, 'Salvataggio…');
  try{
    const j = await apiFetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'prepGift', t:TK, anno:D.anno, id:o.id, value:v})});
    if(!j.ok) throw new Error(j.error||'non salvato');
    saving[o.id]='Salvato'; toast(`${o.nome} ${o.cognome}: ${v?'regalato':'non più regalato'}`);
  }catch(x){ o.regalato = !v; saving[o.id]=''; toast('Non salvato: '+x.message); }
  safeRender(); setTimeout(()=>{ if(saving[o.id]==='Salvato'){ saving[o.id]=''; safeRender(); } }, 1800);
});
$('list').addEventListener('input', e => dalEvent(e, true));
document.querySelector('.seg').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  filter = b.dataset.f; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b)); render();
};
$('q').oninput = render;
$('anno').onchange = e => load(e.target.value);
load();
</script>
</body>
</html>
